name: Commercial license request
description: Buy the commercial license for closed-source use (USD 500, one-time, as is, no support).
title: "Commercial license request: "
body:
  - type: markdown
    attributes:
      value: |
        The standard terms are in [LICENSE.md](https://github.com/ayoub-ac/spi-fpga-core/blob/main/LICENSE.md#commercial-license-closed-source--proprietary-use). Do not post confidential details in this issue.
  - type: input
    id: company
    attributes:
      label: Company
    validations:
      required: true
  - type: dropdown
    id: product-type
    attributes:
      label: Product type
      options:
        - FPGA
        - ASIC
        - FPGA and ASIC
    validations:
      required: true
  - type: input
    id: volume
    attributes:
      label: Volume or project count
      description: Expected units per year, or the number of projects or designs.
    validations:
      required: true
  - type: input
    id: timeline
    attributes:
      label: Timeline
      description: When the license is needed.
    validations:
      required: true
